<script>
/* =========================================================
   E-OFFICE PDAM - Shared Frontend Runtime
   ========================================================= */

const EOF = (function () {
  const state = {
    user: null,
    token: null,
    theme: 'light'
  };

  // ---------- persistence ----------
  const KEYS = { TOKEN: 'eof_token', USER: 'eof_user', THEME: 'eof_theme' };
  function save(k, v) { try { localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v)); } catch(_){} }
  function load(k) { try { return localStorage.getItem(k); } catch(_) { return null; } }
  function loadJSON(k) { const s = load(k); try { return s ? JSON.parse(s) : null; } catch(_){ return null; } }
  function remove(k) { try { localStorage.removeItem(k); } catch(_){} }

  // ---------- theme ----------
  function applyTheme(t) {
    state.theme = t;
    document.documentElement.setAttribute('data-theme', t);
    save(KEYS.THEME, t);
  }
  function toggleTheme() {
    applyTheme(state.theme === 'dark' ? 'light' : 'dark');
  }

  // ---------- session ----------
  function setAuth(token, user) {
    state.token = token; state.user = user;
    save(KEYS.TOKEN, token);
    save(KEYS.USER, user);
  }
  function clearAuth() {
    state.token = null; state.user = null;
    remove(KEYS.TOKEN); remove(KEYS.USER);
  }
  function bootAuth() {
    state.token = load(KEYS.TOKEN);
    state.user = loadJSON(KEYS.USER);
    const t = load(KEYS.THEME) || 'light';
    applyTheme(t);
  }

  function requireLogin() {
    if (!state.token || !state.user) {
      window.top.location.href = appUrl('login');
      return false;
    }
    return true;
  }

  // ---------- URL ----------
  function appUrl(page, extra) {
    // window.APP_URL is injected by the server template
    const base = (window.APP_URL || '').split('?')[0];
    const qs = new URLSearchParams(extra || {});
    if (page) qs.set('page', page);
    return base + '?' + qs.toString();
  }

  // ---------- API (via google.script.run) ----------
  function api(action, payload) {
    const body = Object.assign({ _token: state.token }, payload || {});
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res) return reject(new Error('Empty response'));
          if (res.ok) return resolve(res.data);
          if (res.error && res.error.code === 'UNAUTHORIZED') {
            clearAuth();
            window.top.location.href = appUrl('login');
            return reject(new Error(res.error.message));
          }
          reject(new Error((res.error && res.error.message) || 'API error'));
        })
        .withFailureHandler(function (err) { reject(err); })
        .api(action, body);
    });
  }

  // ---------- Toast ----------
  function toast(message, type, title) {
    type = type || 'success';
    const host = (function () {
      let h = document.querySelector('.toast-host');
      if (!h) {
        h = document.createElement('div');
        h.className = 'toast-host';
        document.body.appendChild(h);
      }
      return h;
    })();
    const t = document.createElement('div');
    t.className = 'toast ' + type;
    const icon = type === 'error'
      ? '<svg class="toast-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
      : type === 'info'
        ? '<svg class="toast-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
        : '<svg class="toast-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
    t.innerHTML = icon +
      '<div style="flex:1"><div class="toast-title">' + (title || (type === 'error' ? 'Terjadi kesalahan' : 'Berhasil')) + '</div>' +
      '<div class="toast-msg">' + (message || '') + '</div></div>';
    host.appendChild(t);
    setTimeout(function () {
      t.style.animation = 'fadeIn .2s reverse';
      setTimeout(function () { t.remove(); }, 180);
    }, 3800);
  }

  // ---------- Modal ----------
  function modal(opts) {
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML =
      '<div class="modal">' +
        '<div class="modal-head"><div class="modal-title">' + (opts.title || '') + '</div>' +
          '<button class="icon-btn" data-close><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>' +
        '</div>' +
        '<div class="modal-body">' + (opts.body || '') + '</div>' +
        (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
      '</div>';
    document.body.appendChild(bg);
    function close() { bg.style.animation = 'fadeIn .2s reverse'; setTimeout(function(){bg.remove();},180); }
    bg.addEventListener('click', function (e) {
      if (e.target === bg) close();
      if (e.target.closest('[data-close]')) close();
    });
    if (typeof opts.onOpen === 'function') opts.onOpen(bg, close);
    return { el: bg, close: close };
  }

  function confirm(message, title) {
    return new Promise(function (resolve) {
      modal({
        title: title || 'Konfirmasi',
        body: '<p>' + (message || 'Apakah Anda yakin?') + '</p>',
        footer:
          '<button class="btn btn-ghost" data-close>Batal</button>' +
          '<button class="btn btn-danger" data-ok>Ya, Lanjutkan</button>',
        onOpen: function (el, close) {
          el.querySelector('[data-ok]').addEventListener('click', function () {
            close(); resolve(true);
          });
          el.addEventListener('click', function (e) {
            if (e.target.closest('[data-close]') || e.target === el) resolve(false);
          });
        }
      });
    });
  }

  // ---------- Format ----------
  function fmtDate(d, withTime) {
    if (!d) return '-';
    const dt = d instanceof Date ? d : new Date(d);
    if (isNaN(dt.getTime())) return '-';
    const dd = ('0' + dt.getDate()).slice(-2);
    const mm = ('0' + (dt.getMonth() + 1)).slice(-2);
    const yy = dt.getFullYear();
    if (withTime) {
      const hh = ('0' + dt.getHours()).slice(-2);
      const mn = ('0' + dt.getMinutes()).slice(-2);
      return dd + '-' + mm + '-' + yy + ' ' + hh + ':' + mn;
    }
    return dd + '-' + mm + '-' + yy;
  }
  function timeAgo(d) {
    if (!d) return '-';
    const dt = d instanceof Date ? d : new Date(d);
    const s = Math.floor((Date.now() - dt.getTime()) / 1000);
    if (s < 60) return 'baru saja';
    if (s < 3600) return Math.floor(s / 60) + ' menit lalu';
    if (s < 86400) return Math.floor(s / 3600) + ' jam lalu';
    if (s < 604800) return Math.floor(s / 86400) + ' hari lalu';
    return fmtDate(d);
  }
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function initials(n) {
    if (!n) return '?';
    return String(n).split(' ').filter(Boolean).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
  }

  function statusBadge(s) {
    const map = {
      'Baru': 'info', 'Didisposisi': 'primary', 'Diproses': 'warning',
      'Selesai': 'success', 'Diarsipkan': '', 'Draft': '',
      'Menunggu Approval': 'warning', 'Disetujui': 'success',
      'Ditolak': 'danger', 'Terkirim': 'info',
      'Dikirim': 'info', 'Dibaca': 'primary'
    };
    const cls = map[s] || '';
    return '<span class="badge ' + cls + '"><span class="dot"></span>' + escapeHtml(s || '-') + '</span>';
  }

  function fileToDataURL(file) {
    return new Promise(function (resolve, reject) {
      const r = new FileReader();
      r.onload = function () { resolve(r.result); };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  // ---------- Logout ----------
  async function logout() {
    try { await api('auth.logout', {}); } catch(_){}
    clearAuth();
    window.top.location.href = appUrl('login');
  }

  // Initialize on load
  bootAuth();

  return {
    state: state, api: api,
    setAuth: setAuth, clearAuth: clearAuth,
    requireLogin: requireLogin, logout: logout,
    appUrl: appUrl,
    toast: toast, modal: modal, confirm: confirm,
    fmtDate: fmtDate, timeAgo: timeAgo, escapeHtml: escapeHtml,
    initials: initials, statusBadge: statusBadge,
    fileToDataURL: fileToDataURL,
    applyTheme: applyTheme, toggleTheme: toggleTheme
  };
})();
</script>
