<style>
/* =========================================================
   E-OFFICE PDAM - Premium Design System
   ========================================================= */

:root {
  --bg: #f6f7fb;
  --bg-2: #eef1f8;
  --surface: #ffffff;
  --surface-2: #f9fafc;
  --border: #e5e9f2;
  --text: #0f172a;
  --text-muted: #64748b;
  --text-soft: #94a3b8;

  --primary: #2563eb;
  --primary-600: #1d4ed8;
  --primary-50: #eff6ff;
  --accent: #06b6d4;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --info: #3b82f6;

  --gradient-1: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%);
  --gradient-2: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
  --gradient-3: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
  --gradient-login: linear-gradient(120deg, #0b1a3a 0%, #1e40af 45%, #06b6d4 100%);

  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 24px;

  --shadow-sm: 0 1px 2px rgba(15,23,42,.05);
  --shadow: 0 8px 30px rgba(15,23,42,.08);
  --shadow-lg: 0 20px 60px rgba(15,23,42,.12);

  --sidebar-w: 248px;
  --topbar-h: 64px;
}

[data-theme="dark"] {
  --bg: #0b1220;
  --bg-2: #0f172a;
  --surface: #111a2e;
  --surface-2: #0c1426;
  --border: #1e293b;
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --text-soft: #64748b;
  --primary-50: rgba(37, 99, 235, 0.1);
  --shadow: 0 8px 30px rgba(0,0,0,.3);
  --shadow-lg: 0 20px 60px rgba(0,0,0,.45);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
a { color: var(--primary); text-decoration: none; }
a:hover { color: var(--primary-600); }
h1,h2,h3,h4 { font-weight: 700; margin: 0; letter-spacing: -0.01em; color: var(--text); }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-soft); }

/* =============== Layout =============== */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}
@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); z-index: 200; }
  .sidebar.is-open { transform: translateX(0); }
  .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 150; }
  .sidebar-backdrop.is-open { display: block; }
}

/* Sidebar */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 18px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  transition: transform .3s ease;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 10px;
}
.brand-logo {
  width: 40px; height: 40px;
  border-radius: 12px;
  background: var(--gradient-1);
  display: grid; place-items: center;
  color: #fff; font-weight: 800;
  box-shadow: 0 8px 20px rgba(37,99,235,.35);
  font-size: 17px;
}
.brand-name { font-weight: 800; letter-spacing: -0.02em; font-size: 16px; }
.brand-sub { font-size: 11px; color: var(--text-muted); }

.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  cursor: pointer;
  font-weight: 500;
  transition: all .2s ease;
  position: relative;
  user-select: none;
}
.nav-item:hover { background: var(--bg-2); color: var(--text); }
.nav-item.active {
  background: var(--primary-50);
  color: var(--primary);
  font-weight: 600;
}
[data-theme="dark"] .nav-item.active { background: rgba(37,99,235,.18); color: #93c5fd; }
.nav-item.active::before {
  content: '';
  position: absolute; left: -12px; top: 8px; bottom: 8px;
  width: 3px; border-radius: 0 3px 3px 0;
  background: var(--primary);
}
.nav-ico { width: 20px; height: 20px; flex-shrink: 0; }
.nav-section {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  color: var(--text-soft); letter-spacing: 0.08em;
  padding: 14px 12px 6px;
}

/* Topbar & main */
.main {
  display: flex; flex-direction: column; min-width: 0;
}
.topbar {
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
  padding: 0 22px;
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(12px);
}
.topbar-title { font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.topbar-search {
  flex: 1; max-width: 420px;
  position: relative;
}
.topbar-search input {
  width: 100%;
  padding: 9px 14px 9px 38px;
  background: var(--bg-2);
  border: 1px solid transparent;
  border-radius: 12px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  transition: all .2s;
}
.topbar-search input:focus {
  outline: none; background: var(--surface);
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(37,99,235,.1);
}
.topbar-search svg {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-soft);
  width: 16px; height: 16px;
}

.icon-btn {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: transparent;
  border: 1px solid transparent;
  display: grid; place-items: center;
  cursor: pointer;
  color: var(--text-muted);
  transition: all .2s;
}
.icon-btn:hover { background: var(--bg-2); color: var(--text); }

.avatar {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--gradient-2);
  color: #fff;
  display: grid; place-items: center;
  font-weight: 700;
  cursor: pointer;
}

.content { padding: 24px 26px 40px; max-width: 1400px; width: 100%; }
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px; margin-bottom: 22px;
  animation: fadeDown .5s ease;
}
.page-title { font-size: 22px; font-weight: 700; }
.page-sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

/* =============== Cards / stats =============== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  transition: transform .25s ease, box-shadow .25s ease;
}
.card:hover { box-shadow: var(--shadow); }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-title { font-weight: 700; font-size: 15px; }

.grid {
  display: grid;
  gap: 16px;
}
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  position: relative;
  overflow: hidden;
  animation: fadeUp .5s ease backwards;
}
.stat-card::after {
  content: ''; position: absolute;
  right: -30px; bottom: -30px;
  width: 140px; height: 140px;
  background: var(--gradient-1);
  opacity: 0.08; filter: blur(30px);
  border-radius: 50%;
}
.stat-card .stat-ico {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--primary-50);
  color: var(--primary);
  display: grid; place-items: center;
  margin-bottom: 14px;
}
.stat-card.success .stat-ico { background: rgba(16,185,129,.12); color: var(--success); }
.stat-card.warning .stat-ico { background: rgba(245,158,11,.12); color: var(--warning); }
.stat-card.danger  .stat-ico { background: rgba(239,68,68,.12);  color: var(--danger); }
.stat-card .stat-label { color: var(--text-muted); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.stat-card .stat-value { font-size: 30px; font-weight: 800; margin: 4px 0 2px; letter-spacing: -0.02em; }
.stat-card .stat-delta { font-size: 12px; color: var(--success); font-weight: 600; }

/* =============== Buttons =============== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  background: var(--primary);
  color: #fff;
  border: 1px solid var(--primary);
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  font-family: inherit;
  transition: all .2s;
  white-space: nowrap;
}
.btn:hover { background: var(--primary-600); border-color: var(--primary-600); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(37,99,235,.35); }
.btn:active { transform: translateY(0); }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: var(--bg-2); border-color: var(--border); box-shadow: none; transform: none; }
.btn-soft { background: var(--primary-50); color: var(--primary); border-color: transparent; }
.btn-soft:hover { background: var(--primary-50); color: var(--primary-600); box-shadow: none; }
.btn-success { background: var(--success); border-color: var(--success); }
.btn-success:hover { background: #0ea371; border-color: #0ea371; box-shadow: 0 6px 20px rgba(16,185,129,.35); }
.btn-danger  { background: var(--danger);  border-color: var(--danger); }
.btn-danger:hover { background: #dc2626; border-color: #dc2626; box-shadow: 0 6px 20px rgba(239,68,68,.35); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }

/* =============== Forms =============== */
.form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-row label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
.input, .select, textarea.input {
  width: 100%;
  padding: 10px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  transition: all .2s;
}
.input:focus, .select:focus, textarea.input:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(37,99,235,.1);
  background: var(--surface);
}
textarea.input { min-height: 90px; resize: vertical; }

/* =============== Table =============== */
.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); }
table.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
table.table thead th {
  text-align: left; padding: 12px 14px;
  background: var(--surface-2);
  color: var(--text-muted);
  font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  font-weight: 700;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 2;
}
table.table tbody td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
table.table tbody tr { transition: background .15s; }
table.table tbody tr:hover { background: var(--surface-2); }
table.table tbody tr:last-child td { border-bottom: none; }

/* =============== Badges =============== */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 600;
  background: var(--bg-2); color: var(--text-muted);
}
.badge.primary { background: rgba(37,99,235,.12); color: var(--primary); }
.badge.success { background: rgba(16,185,129,.12); color: var(--success); }
.badge.warning { background: rgba(245,158,11,.15); color: var(--warning); }
.badge.danger  { background: rgba(239,68,68,.12);  color: var(--danger); }
.badge.info    { background: rgba(59,130,246,.12); color: var(--info); }
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* =============== Timeline =============== */
.timeline { position: relative; padding-left: 30px; }
.timeline::before {
  content: ''; position: absolute;
  left: 9px; top: 8px; bottom: 8px;
  width: 2px;
  background: linear-gradient(180deg, var(--primary) 0%, var(--border) 100%);
}
.timeline-item {
  position: relative;
  padding: 0 0 22px 0;
  animation: fadeLeft .4s ease backwards;
}
.timeline-dot {
  position: absolute;
  left: -30px; top: 4px;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--surface);
  border: 3px solid var(--primary);
  z-index: 1;
  box-shadow: 0 0 0 4px rgba(37,99,235,.12);
}
.timeline-item.success .timeline-dot { border-color: var(--success); box-shadow: 0 0 0 4px rgba(16,185,129,.12); }
.timeline-item.warning .timeline-dot { border-color: var(--warning); box-shadow: 0 0 0 4px rgba(245,158,11,.15); }
.timeline-title { font-weight: 600; font-size: 14px; }
.timeline-meta { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
.timeline-detail { margin-top: 6px; font-size: 13px; color: var(--text); }

/* =============== Toast =============== */
.toast-host {
  position: fixed;
  right: 24px; top: 84px;
  z-index: 9999;
  display: flex; flex-direction: column; gap: 10px;
}
.toast {
  min-width: 280px; max-width: 360px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  display: flex; gap: 12px; align-items: flex-start;
  box-shadow: var(--shadow-lg);
  animation: slideIn .3s ease;
}
.toast .toast-ico { width: 22px; height: 22px; flex-shrink: 0; }
.toast.success .toast-ico { color: var(--success); }
.toast.error   .toast-ico { color: var(--danger); }
.toast.info    .toast-ico { color: var(--info); }
.toast-title { font-weight: 600; font-size: 13px; }
.toast-msg { color: var(--text-muted); font-size: 12px; }

/* =============== Modal =============== */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(15,23,42,.55);
  backdrop-filter: blur(6px);
  z-index: 500;
  display: grid; place-items: center;
  padding: 20px;
  animation: fadeIn .2s ease;
}
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  max-width: 620px; width: 100%;
  max-height: 90vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: popIn .3s ease;
}
.modal-head { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-title { font-weight: 700; font-size: 16px; }
.modal-body { padding: 20px 22px; }
.modal-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

/* =============== Skeleton / Loader =============== */
.skeleton {
  background: linear-gradient(90deg, var(--bg-2) 0%, var(--border) 50%, var(--bg-2) 100%);
  background-size: 400% 100%;
  animation: shimmer 1.4s ease infinite;
  border-radius: 8px;
}
.spinner {
  width: 22px; height: 22px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
.spinner-lg { width: 38px; height: 38px; border-width: 4px; }
.loader-wrap { display: grid; place-items: center; padding: 50px; }

/* =============== Empty =============== */
.empty {
  padding: 44px 20px;
  text-align: center;
  color: var(--text-muted);
}
.empty-ico {
  width: 60px; height: 60px;
  border-radius: 16px;
  margin: 0 auto 14px;
  display: grid; place-items: center;
  background: var(--bg-2); color: var(--text-soft);
}

/* =============== Tabs =============== */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.tab {
  padding: 10px 16px;
  cursor: pointer;
  color: var(--text-muted);
  font-weight: 600; font-size: 13px;
  border-bottom: 2px solid transparent;
  transition: all .2s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--primary); border-color: var(--primary); }

/* =============== QR / Barcode =============== */
.qr-frame {
  background: #fff;
  padding: 14px;
  border-radius: 14px;
  display: inline-block;
  box-shadow: var(--shadow);
}

/* =============== Animations =============== */
@keyframes fadeIn   { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeUp   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeLeft { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
@keyframes popIn    { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
@keyframes slideIn  { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes spin     { to { transform: rotate(360deg); } }
@keyframes shimmer  { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
@keyframes float    { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes pulse    { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

.anim-fade    { animation: fadeUp .5s ease; }
.anim-stagger > * { animation: fadeUp .5s ease backwards; }
.anim-stagger > *:nth-child(1) { animation-delay: .05s; }
.anim-stagger > *:nth-child(2) { animation-delay: .10s; }
.anim-stagger > *:nth-child(3) { animation-delay: .15s; }
.anim-stagger > *:nth-child(4) { animation-delay: .20s; }
.anim-stagger > *:nth-child(5) { animation-delay: .25s; }
.anim-stagger > *:nth-child(6) { animation-delay: .30s; }
.anim-float { animation: float 3s ease-in-out infinite; }
.anim-pulse { animation: pulse 2s ease-in-out infinite; }

/* =============== Utilities =============== */
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.justify-end { justify-content: flex-end; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.gap-6 { gap: 24px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.mt-4 { margin-top: 16px; }
.mt-6 { margin-top: 24px; }
.mb-2 { margin-bottom: 8px; }
.mb-3 { margin-bottom: 12px; }
.mb-4 { margin-bottom: 16px; }
.text-muted { color: var(--text-muted); }
.text-sm { font-size: 12px; }
.text-lg { font-size: 16px; }
.text-xl { font-size: 20px; font-weight: 700; }
.fw-600 { font-weight: 600; }
.fw-700 { font-weight: 700; }
.text-right { text-align: right; }
.text-center { text-align: center; }
.w-full { width: 100%; }
.hide-mobile { display: initial; }
@media (max-width: 640px) { .hide-mobile { display: none; } }
</style>
