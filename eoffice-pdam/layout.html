<!-- Shared sidebar + topbar. Usage:
     <?!= include('layout'); ?> then set:
     <script>EOF_LAYOUT_TITLE = 'Dashboard'; EOF_LAYOUT_PAGE = 'dashboard';</script>
     and wrap page markup inside <div id="eof-page"></div>.
-->
<div class="app-shell">
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">E</div>
      <div>
        <div class="brand-name">E-Office</div>
        <div class="brand-sub">PDAM Tirta Sejahtera</div>
      </div>
    </div>

    <div class="nav-section">Menu Utama</div>
    <a class="nav-item" data-nav="dashboard">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      <span>Dashboard</span>
    </a>
    <a class="nav-item" data-nav="surat-masuk">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><polyline points="4 7 12 13 20 7"/></svg>
      <span>Surat Masuk</span>
    </a>
    <a class="nav-item" data-nav="surat-keluar">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><polyline points="4 13 12 7 20 13"/></svg>
      <span>Surat Keluar</span>
    </a>
    <a class="nav-item" data-nav="disposisi">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span>Disposisi</span>
    </a>
    <a class="nav-item" data-nav="tracking">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>Tracking</span>
    </a>

    <div class="nav-section">Tools</div>
    <a class="nav-item" data-nav="scan">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><rect x="7" y="7" width="10" height="10"/></svg>
      <span>Scan Barcode</span>
    </a>

    <div class="nav-section" data-admin style="display:none">Admin</div>
    <a class="nav-item" data-nav="users" data-admin style="display:none">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Manajemen User</span>
    </a>

    <div style="flex:1"></div>

    <a class="nav-item" id="btn-logout">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Keluar</span>
    </a>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn hide-mobile" id="btn-menu" style="display:none"
        onclick="document.getElementById('sidebar').classList.toggle('is-open');document.getElementById('sidebar-backdrop').classList.toggle('is-open')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title" id="tb-title">&nbsp;</div>

      <div class="topbar-search hide-mobile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="Cari nomor surat, perihal, pengirim..." id="top-search"/>
      </div>
      <div style="flex:1"></div>

      <button class="icon-btn" id="btn-theme" title="Ganti tema">
        <svg id="theme-ico-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <div class="avatar" id="avatar" title="Profil">?</div>
    </header>

    <main class="content" id="eof-page">
      <!-- Page content renders here -->
    </main>
  </div>
</div>

<script>
  // Show hamburger on small screens
  (function () {
    function check() {
      document.getElementById('btn-menu').style.display =
        window.innerWidth <= 900 ? 'grid' : 'none';
    }
    window.addEventListener('resize', check); check();
  })();

  // Init layout shell after DOM ready
  document.addEventListener('DOMContentLoaded', function () {
    if (!EOF.requireLogin()) return;

    // Set user avatar & admin visibility
    const u = EOF.state.user || {};
    document.getElementById('avatar').textContent = EOF.initials(u.nama || u.username);
    if (u.role === 'Admin') {
      document.querySelectorAll('[data-admin]').forEach(function (el) { el.style.display = ''; });
    }

    // Active nav
    const page = window.EOF_LAYOUT_PAGE || 'dashboard';
    document.querySelectorAll('.nav-item[data-nav]').forEach(function (el) {
      const p = el.getAttribute('data-nav');
      el.classList.toggle('active', p === page);
      el.addEventListener('click', function () {
        window.top.location.href = EOF.appUrl(p);
      });
    });

    // Title
    document.getElementById('tb-title').textContent = window.EOF_LAYOUT_TITLE || 'E-Office PDAM';

    // Search behaviour — navigate to surat-masuk list with ?q=
    const search = document.getElementById('top-search');
    search.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && search.value.trim()) {
        window.top.location.href = EOF.appUrl('surat-masuk', { q: search.value.trim() });
      }
    });

    // Theme toggle
    document.getElementById('btn-theme').addEventListener('click', EOF.toggleTheme);

    // Avatar -> logout menu
    document.getElementById('avatar').addEventListener('click', function () {
      EOF.modal({
        title: 'Profil Saya',
        body:
          '<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">' +
            '<div class="avatar" style="width:50px;height:50px;font-size:18px">' + EOF.initials(u.nama) + '</div>' +
            '<div><div class="fw-700">' + EOF.escapeHtml(u.nama || '-') + '</div>' +
            '<div class="text-muted text-sm">' + EOF.escapeHtml(u.jabatan || '-') + '</div></div>' +
          '</div>' +
          '<div class="text-sm"><div><b>Username:</b> ' + EOF.escapeHtml(u.username) + '</div>' +
          '<div><b>Role:</b> <span class="badge primary">' + EOF.escapeHtml(u.role) + '</span></div>' +
          '<div><b>Email:</b> ' + EOF.escapeHtml(u.email || '-') + '</div></div>',
        footer: '<button class="btn btn-ghost" data-close>Tutup</button>' +
                '<button class="btn btn-danger" id="do-logout">Keluar</button>',
        onOpen: function (el) {
          el.querySelector('#do-logout').addEventListener('click', EOF.logout);
        }
      });
    });

    // Logout button in sidebar
    document.getElementById('btn-logout').addEventListener('click', EOF.logout);

    // Close mobile sidebar on backdrop click
    document.getElementById('sidebar-backdrop').addEventListener('click', function () {
      document.getElementById('sidebar').classList.remove('is-open');
      document.getElementById('sidebar-backdrop').classList.remove('is-open');
    });
  });
</script>
